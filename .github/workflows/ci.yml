name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build extension
        run: npm run build

      # Chặn lộ API key vào bundle (bài học: key từng bị Vite nhúng vào dist)
      - name: Scan dist for leaked secrets
        run: node scripts/check-no-secrets.mjs dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusproof-dist
          path: dist/
          retention-days: 7

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Server tests
        run: npm test
